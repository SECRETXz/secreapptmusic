<title>SecretX Music</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: three zones. Library sidebar, scrolling stage, and a persistent player bar. On phones the sidebar becomes bottom tabs. */
:root {
  --bg: #0b0c11;
  --panel: #13151c;
  --raise: #1b1e28;
  --line: #292d3b;
  --fg: #f1f0ec;
  --mute: #9096a8;
  --accent: #3b8cff;
  --accent-ink: #04122b;
  --hue: 215;
  --display: 'Bricolage Grotesque', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --body: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--body);
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .row:focus-visible, input:focus-visible, .tile:focus-visible, .card:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--display); text-wrap: balance; letter-spacing: -0.015em; }

#app {
  height: 100%;
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "side main" "bar bar";
  gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.panel { background: var(--panel); border-radius: 12px; min-width: 0; }

/* sidebar */
.side { grid-area: side; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.top { padding: 14px 12px 8px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 12px 12px; font: 800 20px/1 var(--display); letter-spacing: -0.02em; }
.brand .mark { display: flex; align-items: flex-end; gap: 2px; height: 18px; }
.brand .mark i { width: 3px; background: var(--accent); border-radius: 1px; display: block; }
.brand .mark i:nth-child(1) { height: 8px; } .brand .mark i:nth-child(2) { height: 18px; } .brand .mark i:nth-child(3) { height: 12px; } .brand .mark i:nth-child(4) { height: 15px; }
.nl { display: flex; align-items: center; gap: 14px; width: 100%; padding: 10px 12px; border: 0; background: none; border-radius: 8px; color: var(--mute); font-weight: 600; text-align: left; }
.nl:hover, .nl.on { color: var(--fg); }
.nl.on { background: var(--raise); }
.libp { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.libh { display: flex; align-items: center; gap: 10px; padding: 14px 20px 8px; color: var(--mute); font-weight: 600; }
.libh span { flex: 1; }
.libh button { border: 0; background: none; color: var(--mute); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; }
.libh button:hover { color: var(--fg); background: var(--raise); }
.lib { overflow-y: auto; padding: 0 8px 8px; flex: 1; }
.li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: none; text-align: left; }
.li:hover, .li.on { background: var(--raise); }
.li strong { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li small { color: var(--mute); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv { display: block; width: 100%; aspect-ratio: 1; border-radius: 6px; background-size: cover; background-position: center; background-color: var(--raise); }
.cv.heart { display: grid; place-items: center; background: linear-gradient(135deg, #5b3df0, #d6a3ff); color: #fff; }
.cv.files { display: grid; place-items: center; background: linear-gradient(135deg, #1f6f5c, #88e0b4); color: #06241b; }

/* stage */
.main {
  grid-area: main; overflow-y: auto; overflow-x: hidden; min-height: 0;
  padding: 24px clamp(16px, 3vw, 32px) 32px;
  background: linear-gradient(180deg, hsl(var(--hue) 38% 17%) 0, var(--panel) 340px);
  transition: background .6s;
}
.kicker { color: var(--mute); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
.hello h1 { font-size: clamp(28px, 5vw, 44px); font-weight: 800; line-height: 1.15; margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; margin: 22px 0 30px; }
.tile { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 12px 0 0; height: 56px; border: 0; border-radius: 6px; background: color-mix(in srgb, var(--fg) 8%, transparent); text-align: left; overflow: hidden; }
.tile:hover { background: color-mix(in srgb, var(--fg) 15%, transparent); }
.tile .cv { height: 56px; width: 56px; border-radius: 0; aspect-ratio: auto; }
.tile strong { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 0 10px; }
.sec-h h2 { font-size: 22px; font-weight: 800; }
.sec-h span { color: var(--mute); font-size: 13px; }
.note { margin-top: 28px; padding: 14px 16px; border: 1px dashed var(--line); border-radius: 10px; color: var(--mute); font-size: 13px; max-width: 62ch; }
.note b { color: var(--fg); font-weight: 600; }

.phead { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
.phead .cv { width: clamp(120px, 22vw, 200px); border-radius: 10px; box-shadow: 0 12px 32px rgba(0, 0, 0, .45); flex: none; }
.phead .txt { min-width: 0; flex: 1 1 240px; }
.phead h1 { font-size: clamp(30px, 6vw, 56px); font-weight: 800; line-height: 1.1; margin: 4px 0 8px; }
.phead .desc { color: var(--mute); max-width: 56ch; }
.phead .meta { margin-top: 8px; font-size: 13px; color: var(--mute); }
.acts { display: flex; align-items: center; gap: 14px; margin: 22px 0 14px; }
.big { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: transform .12s; }
.big:hover { transform: scale(1.05); }
.ghost { height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid var(--line); background: none; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.ghost:hover { border-color: var(--mute); }

.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(0, 0.7fr) 32px 48px; align-items: center; gap: 12px; padding: 6px 12px 6px 8px; border-radius: 8px; cursor: pointer; }
.row:hover { background: color-mix(in srgb, var(--fg) 8%, transparent); }
.row .idx { text-align: center; color: var(--mute); position: relative; height: 18px; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.row .who { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; align-items: center; min-width: 0; }
.row .tt { min-width: 0; }
.row .tt strong { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tt small { display: block; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .alb { color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.row time { color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
.like { border: 0; background: none; color: var(--mute); width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
.row .like { opacity: 0; }
.row:hover .like, .row .like[aria-pressed="true"], .row .like:focus-visible { opacity: 1; }
.like:hover { color: var(--fg); }
.like[aria-pressed="true"] { color: var(--accent); }
.row.is-cur .tt strong, .row.is-cur .idx { color: var(--accent); }
.eq { display: none; align-items: flex-end; gap: 2px; height: 14px; }
.eq i { width: 3px; background: var(--accent); border-radius: 1px; height: 4px; display: block; }
.row.is-playing .idx b { display: none; }
.row.is-playing .eq { display: flex; }
.row.is-playing .eq i { animation: bounce .9s ease-in-out infinite; }
.row.is-playing .eq i:nth-child(2) { animation-delay: -.3s; }
.row.is-playing .eq i:nth-child(3) { animation-delay: -.6s; }
@keyframes bounce { 0%, 100% { height: 3px; } 50% { height: 14px; } }

.empty { padding: 40px 16px; text-align: center; color: var(--mute); border: 1px dashed var(--line); border-radius: 12px; }
.empty strong { display: block; color: var(--fg); font-family: var(--display); font-size: 18px; margin-bottom: 4px; }
.drop { margin: 18px 0; padding: 28px 16px; text-align: center; border: 1.5px dashed var(--line); border-radius: 12px; color: var(--mute); }
.drop.over { border-color: var(--accent); color: var(--fg); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.drop strong { color: var(--fg); display: block; font-family: var(--display); font-size: 18px; margin-bottom: 4px; }

.search { display: flex; align-items: center; gap: 10px; max-width: 460px; height: 46px; padding: 0 16px; border-radius: 23px; background: var(--raise); border: 1px solid var(--line); margin: 6px 0 22px; }
.search input { flex: 1; min-width: 0; background: none; border: 0; color: var(--fg); font: inherit; font-size: 15px; outline: none; }
.search:focus-within { border-color: var(--accent); }
.search svg { color: var(--mute); flex: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 16px; }
.card { border: 0; background: color-mix(in srgb, var(--fg) 5%, transparent); border-radius: 10px; padding: 12px; text-align: left; display: block; width: 100%; min-width: 0; }
.card:hover { background: color-mix(in srgb, var(--fg) 11%, transparent); }
.card .cv { margin-bottom: 10px; border-radius: 8px; }
.card strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { color: var(--mute); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* player bar */
.bar {
  grid-area: bar; padding: 10px 16px; background: var(--panel); border-radius: 12px;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 540px) minmax(0, 1fr);
  grid-template-areas: "np ctl vol" "np seek vol"; align-items: center; column-gap: 20px; row-gap: 2px;
}
.np { grid-area: np; display: grid; grid-template-columns: 52px minmax(0, 1fr) 32px; gap: 12px; align-items: center; min-width: 0; }
.np .cv { width: 52px; }
.np .tt { min-width: 0; }
.np strong { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np small { display: block; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl { grid-area: ctl; display: flex; justify-content: center; align-items: center; gap: 10px; }
.ib { width: 36px; height: 36px; border: 0; background: none; border-radius: 50%; color: var(--mute); display: grid; place-items: center; position: relative; }
.ib:hover { color: var(--fg); }
.ib.on { color: var(--accent); }
.ib.on::after { content: ""; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.ib.main-btn { width: 40px; height: 40px; background: var(--fg); color: var(--bg); }
.ib.main-btn:hover { transform: scale(1.06); color: var(--bg); }
.ib .one { position: absolute; font: 700 8px/1 var(--body); top: 11px; left: 50%; margin-left: -2px; }
.seek { grid-area: seek; display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 8px; align-items: center; color: var(--mute); font-size: 12px; font-variant-numeric: tabular-nums; }
.seek time:first-child { text-align: right; }
.vol { grid-area: vol; display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.vol .rng { width: 110px; }
.rng { -webkit-appearance: none; appearance: none; background: transparent; height: 16px; width: 100%; margin: 0; cursor: pointer; --p: 0%; }
.rng::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--fg) var(--p), var(--line) var(--p)); }
.rng:hover::-webkit-slider-runnable-track { background: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
.rng::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line); }
.rng::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--fg); }
.rng:hover::-moz-range-progress { background: var(--accent); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--fg); margin-top: -4px; opacity: 0; }
.rng::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--fg); opacity: 0; }
.rng:hover::-webkit-slider-thumb, .rng:focus-visible::-webkit-slider-thumb { opacity: 1; }
.rng:hover::-moz-range-thumb, .rng:focus-visible::-moz-range-thumb { opacity: 1; }
@media (hover: none) { .rng::-webkit-slider-thumb { opacity: 1; } .rng::-moz-range-thumb { opacity: 1; } .row .like { opacity: 1; } }

.navm { grid-area: nav; display: none; }
.toast { position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 10px); background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 22px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.row.hit { grid-template-columns: 36px minmax(0, 1fr) minmax(0, 0.7fr) 32px; color: inherit; text-decoration: none; }
.open { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 15px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.row.hit { cursor: pointer; }
.row.is-loading .idx b { opacity: .35; }
.opens { display: flex; gap: 6px; }
.open { color: var(--fg); text-decoration: none; }
.open:hover { border-color: var(--accent); color: var(--accent); }
.hint { color: var(--mute); font-size: 13px; margin: -2px 0 10px; max-width: 62ch; }
.hits { margin-bottom: 26px; }
@media (max-width: 900px) {
  #app { grid-template-columns: 200px minmax(0, 1fr); }
  .row { grid-template-columns: 36px minmax(0, 1fr) 32px 48px; }
  .row.hit { grid-template-columns: 36px minmax(0, 1fr) 32px; }
  .row .alb { display: none; }
  .vol .rng { width: 80px; }
}
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; grid-template-areas: "main" "bar" "nav"; gap: 6px; }
  .side { display: none; }
  .navm { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border-radius: 12px; padding: 4px; }
  .navm button { border: 0; background: none; color: var(--mute); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; font-size: 11px; font-weight: 600; border-radius: 8px; }
  .navm button.on { color: var(--fg); }
  .bar { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "np ctl" "seek seek"; column-gap: 8px; padding: 8px 12px; }
  .bar .opt, .vol { display: none; }
  .ctl { gap: 2px; }
  .seek { grid-template-columns: 36px minmax(0, 1fr) 36px; }
  .main { padding-top: 18px; }
  .toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  .row.is-playing .eq i { animation: none; height: 10px; }
  .main, .toast, .big { transition: none; }

function renderResults() {
  const box = $('#results'); if (!box) return;
  const q = S.q.trim();
  if (!q) {
    box.innerHTML = hitsSection('ชาร์ตเพลงไทย', 'Spotify · iTunes · วิทยุ', thHits(), true, 'hits-th') + hitNote + hitsSection('เพลงสากล · K-pop', 'Billboard · ชาร์ตไทย · ฮิตตลอดกาล', intlHits(), true, 'hits-intl') +
      '<div class="sec-h"><h2>เลือกดูตามอารมณ์</h2></div><div class="grid">' + PLAYLISTS.map(plCard).join('') + '</div>';
    return;
  }
  const l = searchResults(), hs = hitsFor(q), fl = S.foundQ === q ? S.found : [];
  const nq = norm(q), ars = nq.length >= 2 ? ARTISTS.filter(a => a.match.some(m => m.indexOf(nq) >= 0 || nq.indexOf(m) >= 0)) : [];
  box.innerHTML = (ars.length ? '<div class="sec-h"><h2>ศิลปิน</h2></div><div class="grid">' + ars.map(artistCard).join('') + '</div>' : '') + (fl.length ? '<div class="sec-h"><h2>ฟังตัวอย่างได้เลย</h2><span>iTunes · 30 วินาที</span></div>' + rows(fl, 'itunes') : '') + (l.length ? '<div class="sec-h"><h2>ในแอพ เล่นได้เลย</h2><span>' + l.length + ' เพลง</span></div>' + rows(l, 'search') : '') +
    (hs.length ? '<div class="hits" style="margin-top:20px"><div class="sec-h"><h2>เพลงดัง</h2><span>' + hs.length + ' เพลง</span></div><div class="list">' + hs.map((h, i) => hitRow(h, i, false, 'hits-search')).join('') + '</div>' + hitNote + '</div>' : '') +
    (!l.length && !hs.length && !fl.length && !ars.length ? '<div class="empty"><strong>ไม่พบ “' + esc(q) + '”</strong>ลองพิมพ์ชื่อศิลปิน เช่น GAVIN:D, Drake หรือชื่อเพลง</div>' : '');
  syncMarks();
}
function syncMarks() {
  scanArt();
  document.querySelectorAll('.row').forEach(r => {
    const cur = S.cur && r.getAttribute('data-id') === S.cur.id;  // hit rows carry no data-id
    r.classList.toggle('is-cur', !!cur); r.classList.toggle('is-loading', !!cur && S.loading); r.classList.toggle('is-playing', !!cur && S.playing);
  });
}
function renderPlayer() {
  const t = S.cur;
  $('#npTitle').textContent = t ? t.title : 'ยังไม่ได้เลือกเพลง';
  $('#npArtist').textContent = t ? (S.loading ? (S.status || 'กำลังหาเสียง…') : t.artist + (t.yt ? ' · เต็มเพลงจาก YouTube' : t.remote ? ' · ตัวอย่าง 30 วิ' : '')) : 'กดเล่นเพลงใดก็ได้เพื่อเริ่ม';
  $('#npCover').style.backgroundImage = t ? coverOf(t) : 'var(--logo)';
  const nl = $('#npLike'); nl.style.visibility = t ? 'visible' : 'hidden';
  if (t) { nl.setAttribute('data-like', t.id); nl.setAttribute('aria-pressed', fav(t.id)); nl.innerHTML = ic(fav(t.id) ? 'heartfill' : 'heart', 18); nl.className = 'like'; }
  $('#bPlay').innerHTML = ic(S.playing ? 'pause' : 'play', 20);
  $('#bPlay').setAttribute('aria-label', S.playing ? 'หยุดชั่วคราว' : 'เล่น');
  $('#bPrev').innerHTML = ic('prev', 20); $('#bNext').innerHTML = ic('next', 20);
  const sh = $('#bShuffle'); sh.innerHTML = ic('shuffle', 20); sh.classList.toggle('on', S.shuffle); sh.setAttribute('aria-pressed', S.shuffle);
  const rp = $('#bRepeat'); rp.innerHTML = ic('repeat', 20) + (S.repeat === 2 ? '<span class="one">1</span>' : '');
  rp.classList.toggle('on', S.repeat > 0); rp.setAttribute('aria-pressed', S.repeat > 0);
  rp.setAttribute('aria-label', 'เล่นซ้ำ: ' + ['ปิด', 'ทั้งคิว', 'เพลงนี้']);
  rp.setAttribute('aria-label', 'เล่นซ้ำ: ' + ['ปิด', 'ทั้งคิว', 'เพลงนี้'][S.repeat]);
  document.documentElement.style.setProperty('--hue', t ? hueOf(t.id) : 215);
}
function syncAll() { renderPlayer(); syncMarks(); }
function go(view) { S.view = view; renderSide(); renderMain(); $('#main').scrollTop = 0; if (view === 'search') { const q = $('#q'); if (q) q.focus(); } }

/* progress loop */
function tick() {
  const dur = getDur(), pos = Math.min(getPos(), dur || 0);
  if (!S.dragging) {
    const r = $('#seek'); r.value = dur ? Math.round(pos / dur * 1000) : 0; r.style.setProperty('--p', (dur ? pos / dur * 100 : 0) + '%');
    $('#tCur').textContent = fmt(pos);
  }
  $('#tDur').textContent = fmt(dur);
  if (S.playing && S.cur && !S.cur.file && !S.cur.remote && dur > 0 && pos >= dur - 0.03 && !S.ending) { S.ending = true; step(1, true); }
  requestAnimationFrame(tick);
}

/* ---------- uploads ---------- */
function addFiles(files) {
  const ok = Array.prototype.filter.call(files, f => /^audio\//.test(f.type) || /\.(mp3|m4a|aac|wav|ogg|flac|opus)$/i.test(f.name));
  if (!ok.length) { toast('ไม่พบไฟล์เสียง ลองไฟล์ mp3, m4a, wav หรือ ogg'); return; }
  ok.forEach(f => {
    const t = { id: 'u' + (++uid), title: f.name.replace(/\.[^.]+$/, ''), artist: 'ไฟล์ของคุณ', tag: 'อัปโหลด', file: URL.createObjectURL(f), dur: 0 };
    S.uploads.push(t);
    const a = new Audio(); a.preload = 'metadata'; a.src = t.file;
    a.addEventListener('loadedmetadata', () => { t.dur = a.duration; document.querySelectorAll('[data-dur="' + t.id + '"]').forEach(el => { el.textContent = fmt(t.dur); }); });
  });
  toast('เพิ่ม ' + ok.length + ' ไฟล์แล้ว');
  go('mine');
}

/* ---------- เพิ่มเพลงด้วยลิงก์ (ไฟล์เสียงตรง ๆ หรือลิงก์ YouTube) ---------- */
const URL_KEY = 'soundroom.urls';
function urlsLoad() { try { return JSON.parse(localStorage.getItem(URL_KEY) || '[]'); } catch (e) { return []; } }
function mkUrlTrack(x) {
  const t = { id: x.id, title: x.title, artist: x.yt ? 'YouTube' : 'ลิงก์ของฉัน', tag: 'ลิงก์', dur: 0 };
  if (x.yt) { t.yt = x.yt; t.remote = true; t.art = 'https://i.ytimg.com/vi/' + x.yt + '/mqdefault.jpg'; }
  else {
    t.file = x.url;
    const a = new Audio(); a.preload = 'metadata'; a.src = t.file;
    a.addEventListener('loadedmetadata', () => { t.dur = a.duration; document.querySelectorAll('[data-dur="' + t.id + '"]').forEach(el => { el.textContent = fmt(t.dur); }); });
  }
  return t;
}
function addByUrl() {
  const u = (prompt('วางลิงก์เพลง\n• ไฟล์เสียงตรง ๆ เช่น https://.../song.mp3\n• หรือลิงก์ YouTube') || '').trim();
  if (!u) return;
  let url; try { url = new URL(u); } catch (e) { toast('ลิงก์ไม่ถูกต้อง'); return; }
  const yt = (u.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/)([\w-]{11})/) || [])[1];
  if (!yt && /(spotify|soundcloud|music\.apple|deezer)\./i.test(url.hostname)) { toast('ลิงก์หน้าเว็บของ Spotify/SoundCloud เล่นในแอพไม่ได้ ต้องเป็นลิงก์ไฟล์เสียงตรง ๆ หรือ YouTube'); return; }
  if (!yt && url.protocol !== 'https:' && location.protocol === 'https:') { toast('ต้องเป็นลิงก์ https:// เท่านั้น'); return; }
  const def = yt ? 'เพลงจาก YouTube' : decodeURIComponent(url.pathname.split('/').pop() || '').replace(/\.[^.]+$/, '') || 'เพลงจากลิงก์';
  const title = (prompt('ตั้งชื่อเพลง', def) || def).trim() || def;
  const x = { id: 'l' + Date.now(), title, url: u, yt: yt || '' };
  const list = urlsLoad(); list.push(x);
  try { localStorage.setItem(URL_KEY, JSON.stringify(list)); } catch (e) {}
  S.uploads.push(mkUrlTrack(x)); toast('เพิ่มเพลงแล้ว'); go('mine');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const lk = t.closest('[data-like]');
  if (lk) { const id = lk.getAttribute('data-like'); S.liked.has(id) ? S.liked.delete(id) : S.liked.add(id); saveLiked(); lmSync(id); renderSide(); if (S.view === 'liked') renderMain(); else { document.querySelectorAll('[data-like="' + id + '"]').forEach(b => { b.setAttribute('aria-pressed', fav(id)); b.setAttribute('aria-label', fav(id) ? 'เลิกถูกใจ' : 'ถูกใจ'); b.innerHTML = ic(fav(id) ? 'heartfill' : 'heart', 18); }); } renderPlayer(); return; }
  const g = t.closest('[data-go]'); if (g) { go(g.getAttribute('data-go')); return; }
  const pc = t.closest('[data-playctx]'); if (pc) { const c = pc.getAttribute('data-playctx'), l = listFor(c); if (l.length) { S.shuffle = false; playTrack(l[0].id, c); } return; }
  const sc = t.closest('[data-shuffle-ctx]'); if (sc) { const c = sc.getAttribute('data-shuffle-ctx'), l = listFor(c); if (l.length) { S.shuffle = true; playTrack(l[Math.floor(Math.random() * l.length)].id, c); } return; }
  if (t.closest('[data-pick]')) { $('#file').click(); return; }
  if (t.closest('[data-addurl]')) { addByUrl(); return; }
  if (t.closest('[data-clearurls]')) {
    try { localStorage.removeItem(URL_KEY); } catch (x) {}
    S.uploads = S.uploads.filter(u => u.id.charAt(0) !== 'l'); toast('ล้างลิงก์ที่เพิ่มแล้ว'); renderSide(); renderMain(); return;
  }
  if (t.closest('[data-ytkey]')) { ytKeyAsk(); return; }
  if (t.closest('[data-srcsw]')) {
    const nv = srcGet() === 'yt' ? 'it' : 'yt'; srcSet(nv);
    if (nv === 'it') { HITS.concat(Object.keys(REG).map(k => REG[k])).forEach(x => { x.yt = null; }); ytStop(); ytCur = ''; }
    else HITS.concat(Object.keys(REG).map(k => REG[k])).forEach(x => { x.tried = false; });
    toast(nv === 'it' ? 'ใช้ตัวอย่าง 30 วิจาก iTunes (ไม่มีโฆษณา)' : 'ใช้เต็มเพลงจาก YouTube (อาจมีโฆษณา)');
    if (S.cur && S.cur.remote && S.playing) playTrack(S.cur.id);
    return;
  }
  if (t.closest('a.open')) return;
  const r = t.closest('.row'); if (r) { const id = r.getAttribute('data-id'); if (S.cur && S.cur.id === id) togglePlay(); else playTrack(id, r.getAttribute('data-ctx')); }
});
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('row') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.target.click(); return; }
  if (e.code === 'Space' && !/^(INPUT|BUTTON|TEXTAREA)$/.test(e.target.tagName) && !(e.target.classList && e.target.classList.contains('row')) && e.target.tagName !== 'A') { e.preventDefault(); togglePlay(); }
});
let lsT;
function liveSearch() {
  clearTimeout(lsT);
  const q = S.q.trim();
  if (q.length < 2) { S.found = []; S.foundQ = ''; return; }
  lsT = setTimeout(async () => {
    try { const res = await itunes(q, 10, 'TH', true); if (S.q.trim() !== q) return; S.found = res.map(toTrack); }
    catch (e) { if (S.q.trim() !== q) return; S.found = []; }
    S.foundQ = q; renderResults();
  }, 450);
}
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; renderResults(); liveSearch(); } });
$('#bPlay').addEventListener('click', togglePlay);
$('#bNext').addEventListener('click', () => step(1, false));
$('#bPrev').addEventListener('click', prevTrack);
$('#bShuffle').addEventListener('click', () => { S.shuffle = !S.shuffle; renderPlayer(); });
$('#bRepeat').addEventListener('click', () => { S.repeat = (S.repeat + 1) % 3; renderPlayer(); });
$('#bMute').addEventListener('click', () => { S.muted = !S.muted; setVolume(); });
$('#vol').addEventListener('input', e => { S.vol = e.target.value / 100; S.muted = false; setVolume(); });
const sk = $('#seek');
sk.addEventListener('input', () => { S.dragging = true; const d = getDur(); sk.style.setProperty('--p', sk.value / 10 + '%'); $('#tCur').textContent = fmt(sk.value / 1000 * d); });
sk.addEventListener('change', () => { seekTo(sk.value / 1000 * getDur()); S.dragging = false; });
$('#addBtn').innerHTML = ic('plus', 18);
$('#addBtn').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
['dragover', 'dragenter'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => window.addEventListener(ev, e => { const d = $('#drop'); if (d) d.classList.remove('over'); }));
window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

/* ปลดล็อกเสียงบนมือถือ: เบราว์เซอร์มือถือยอมให้เล่นเสียงหลังรอโหลดได้ ก็ต่อเมื่อเคยเล่นเสียงจากการแตะมาก่อน */
document.addEventListener('click', function () {
  try {
    if (S.cur) return;
    audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
    const p = audio.play(); if (p && p.catch) p.catch(() => {});
    audio.setAttribute('data-id', '');
  } catch (e) {}
}, { once: true, capture: true });

/* ---------- เพลงของคุณเองใน repo: วางไฟล์ในโฟลเดอร์ music/ แล้วระบุใน songs.json ---------- */
function loadLibrary() {
  fetch('songs.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : []).then(list => {
    if (!Array.isArray(list) || !list.length) return;
    const ids = [];
    list.forEach((x, i) => {
      if (!x || !x.file) return;
      const t = { id: 's' + i, title: x.title || String(x.file).replace(/^.*\//, '').replace(/\.[^.]+$/, ''), artist: x.artist || 'เพลงของฉัน', tag: x.album || 'เพลงของฉัน', file: encodeURI(x.file), dur: 0 };
      if (x.cover) t.art = encodeURI(x.cover);
      TRACKS.push(t); ids.push(t.id);
      const a = new Audio(); a.preload = 'metadata'; a.src = t.file;
      a.addEventListener('loadedmetadata', () => { t.dur = a.duration; document.querySelectorAll('[data-dur="' + t.id + '"]').forEach(el => { el.textContent = fmt(t.dur); }); });
    });
    if (!ids.length) return;
    PLAYLISTS.unshift({ id: 'p0', name: 'เพลงของฉัน', desc: 'เพลงที่เก็บไว้ในเว็บนี้ เล่นได้ทุกอุปกรณ์ ไม่มีโฆษณา', ids });
    renderSide(); renderMain();
  }).catch(() => {});
}

/* ---------- boot ---------- */
try { const m = /url\(["']?(.*?)["']?\)/.exec(getComputedStyle(document.documentElement).getPropertyValue('--logo')); if (m) { const l = document.createElement('link'); l.rel = 'icon'; l.href = m[1]; document.head.appendChild(l); } } catch (e) {}
(function () {
  const m = lmLoad();
  Object.keys(m).forEach(id => {
    if (!S.liked.has(id) || REG[id] || byId(id)) return;
    const x = m[id];
    REG[id] = { id, title: x.title, artist: x.artist, tag: x.tag, remote: true, file: x.file || null, yt: srcGet() === 'yt' ? (x.yt || null) : null, dur: 30, art: x.art || undefined };
  });
})();
urlsLoad().forEach(x => { if (x && x.id && x.title) S.uploads.push(mkUrlTrack(x)); });
setVolume(); renderSide(); renderMain(); renderPlayer(); requestAnimationFrame(tick); loadLibrary();
})();
</script>

</body></html>
